[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "trajclaims"
version = "0.1.0"
description = "False-completion audit of public Terminal-Bench 2 trajectories: what agents claim against what the verifier found."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "trajclaims contributors" }]
keywords = [
    "llm evaluation", "agent evaluation", "false completion", "terminal-bench",
    "measurement error", "cluster bootstrap",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "pyarrow>=15", "scikit-learn>=1.5",
]

[project.urls]
Homepage = "https://github.com/h-a-forster/trajclaims"
Documentation = "https://github.com/h-a-forster/trajclaims/tree/main/docs"
Issues = "https://github.com/h-a-forster/trajclaims/issues"

[project.scripts]
trajclaims = "trajclaims.cli:main"

[dependency-groups]
# statsmodels is only a reference implementation for the regression tests.
dev = ["pytest>=8", "ruff>=0.6", "statsmodels>=0.14.2"]

[tool.uv]
# Lock only releases at least two weeks old; move this date deliberately.
exclude-newer = "2026-10-16T00:00:00Z"

[tool.hatch.build.targets.wheel]
packages = ["src/trajclaims"]

[tool.hatch.build.targets.sdist]
include = [
    "src/trajclaims", "tests", "docs", "configs", "results", "uv.lock",
    "README.md", "LICENSE", "CONTRIBUTING.md", "SECURITY.md", "CITATION.cff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: checks that take more than a few seconds (run with --runslow)"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tmp", "data", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
